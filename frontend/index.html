<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina Finance</title>
    <meta name="description" content="Facts-only AI assistant for HDFC Mutual Fund scheme information.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <button class="hamburger-btn" id="hamburger-btn" aria-label="Toggle sidebar" aria-expanded="false" aria-controls="right-rail">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <h1 class="brand-title">Lumina Finance</h1>
        </div>
        <div class="header-right">
            <div class="status-pill" id="status-pill" aria-label="Status: Idle">
                <span class="status-icon" id="status-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </span>
                <span class="status-label" id="status-label">Synced Today</span>
            </div>
            <div class="info-tooltip-container">
                <button class="info-btn" aria-label="Disclaimer Information">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                </button>
                <div class="tooltip-content" role="tooltip">
                    Facts only, no investment advice. Answers come from published scheme pages.
                </div>
            </div>
        </div>
        <div class="progress-bar-container" id="progress-bar-container">
            <div class="progress-bar-fill"></div>
        </div>
    </header>

    <div class="app-body">
        <main class="chat-column">
            <div class="chat-thread" id="chat-thread" role="log" aria-live="polite">
                <!-- Empty state and messages will be injected here by JS -->
            </div>
            
            <div class="input-area">
                <div class="queued-note hidden" id="queued-note">
                    Queued. This sends automatically when the sync finishes.
                </div>
                <form id="chat-form" class="chat-form">
                    <input type="text" id="query-input" class="query-input" placeholder="Ask a factual question..." autocomplete="off">
                    <button type="submit" id="send-btn" class="send-btn" aria-label="Send message">Send</button>
                </form>
            </div>
        </main>

        <!-- Right rail starts out hidden on mobile -->
        <aside class="right-rail" id="right-rail">
            <div class="rail-header">
                <h2>Your chats</h2>
                <button id="new-chat-btn" class="icon-btn" aria-label="New chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
            <div class="history-list" id="history-list">
                <!-- History grouped by date injected by JS -->
            </div>
            
            <div class="popular-section">
                <div class="rail-header">
                    <h2>Popular this week</h2>
                </div>
                <div class="popular-list" id="popular-list">
                    <!-- 4 items injected by JS -->
                </div>
            </div>
        </aside>
        
        <!-- Mobile overlay backdrop for when rail is open -->
        <div class="rail-backdrop" id="rail-backdrop" aria-hidden="true"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
